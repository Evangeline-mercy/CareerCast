name: CareerCast Milestone 4 CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test-and-accuracy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "42"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies and CareerCast package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -e .

      - name: Compile source
        run: |
          python -m py_compile api/main.py
          python -m py_compile api/services/gap_analysis.py
          python -m py_compile streamlit_app/app.py
          python -m py_compile streamlit_app/report_builder.py
          python -m py_compile src/careercast/client.py
          python -m py_compile src/careercast/parsing.py
          python -m py_compile src/careercast/cli.py

      - name: Run skill-gap tests
        run: python -m pytest tests/test_gap_analysis_ci.py -v --assert=plain

      - name: Run API contract tests
        run: python -m pytest tests/test_api_contract.py -v --assert=plain

      - name: Run package and CLI tests
        run: |
          python -m pytest tests/test_package_parsing.py -v --assert=plain
          python -m pytest tests/test_package_client.py -v --assert=plain
          python -m pytest tests/test_cli.py -v --assert=plain

      - name: Run integration and regression tests
        run: |
          python -m pytest tests/test_pipeline_integration.py -v --assert=plain
          python -m pytest tests/test_pipeline_regression.py -v --assert=plain

      - name: Run PDF report test
        run: python -m pytest tests/test_pdf_report.py -v --assert=plain

      - name: Run genuine accuracy gate
        run: python -m pytest tests/test_accuracy_gate.py -v --assert=plain -s

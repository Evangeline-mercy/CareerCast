name: CareerCast Milestone 3 CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test-and-accuracy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "42"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Compile Milestone 3 source
        run: |
          python -m py_compile api/main.py
          python -m py_compile api/services/gap_analysis.py

      - name: Run skill-gap tests
        run: python -m pytest tests/test_gap_analysis_ci.py -v --assert=plain

      - name: Run API contract tests
        run: python -m pytest tests/test_api_contract.py -v --assert=plain

      - name: Run genuine accuracy gate
        run: python -m pytest tests/test_accuracy_gate.py -v --assert=plain -s
